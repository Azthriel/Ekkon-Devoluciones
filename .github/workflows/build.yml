name: Compilar .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "flet[all]==0.28.3" pyinstaller pytest

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Leer versión
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from ekkon.version import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: >
          flet pack main.py -y
          --name EkkonDevoluciones
          --icon assets/icono.ico
          --product-name "Ekkon Devoluciones"
          --file-description "Ekkon Devoluciones"
          --product-version ${{ steps.ver.outputs.version }}
          --file-version ${{ steps.ver.outputs.version }}.0
          --company-name "Ekkon"
          --copyright "Ekkon"

      - name: Subir artefacto
        uses: actions/upload-artifact@v5
        with:
          name: EkkonDevoluciones-${{ steps.ver.outputs.version }}
          path: dist/EkkonDevoluciones.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EkkonDevoluciones.exe
          generate_release_notes: true
