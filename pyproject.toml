# Configuración para "flet build apk" (versión para celulares Android).
# El .exe de Windows se sigue compilando con "flet pack" y requirements.txt.
[project]
name = "ekkondevoluciones"
version = "0.8.5"
description = "Ekkon Devoluciones"
requires-python = ">=3.12"
# Sin google-auth: la sincronización con planillas se hace solo desde la PC del administrador
dependencies = [
    "flet==0.28.3",
    "requests>=2.32",
    "pillow",
    "flet-camara",
]

[tool.flet]
org = "com.ekkon"
product = "Ekkon Devoluciones"
company = "Ekkon"
copyright = "Ekkon"

[tool.flet.app]
path = "."
exclude = ["tests", ".github", "android", "extensiones", "build", "dist", "README.md", "firestore.rules", "requirements.txt",
           "pyproject.toml", ".gitignore"]

# Extensión propia para la cámara (se instala desde la carpeta del repositorio)
[tool.flet.dev_packages]
flet-camara = "extensiones/flet_camara"

[tool.flet.android]
adaptive_icon_background = "#1F4E8C"

[tool.flet.android.signing]
key_alias = "ekkon"
